[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siteposture"
version = "0.1.0"
description = "Safe-by-default HTTP response security posture checker"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Hackcatimka"}]
keywords = ["appsec", "security-headers", "devsecops"]

[project.scripts]
siteposture = "siteposture.cli:main"

[project.optional-dependencies]
dev = [
    "bandit>=1.7.10,<2",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
